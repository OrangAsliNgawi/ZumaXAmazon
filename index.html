<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Flash Game</title>
  <style>
    body {
      margin: 0;
      background-color: #1a1a1a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }

    #game-container {
      width: 90%;
      max-width: 800px;
      aspect-ratio: 4 / 3;
      /* Adjust this to match your game's aspect ratio */
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 1.5rem;
    }
  </style>
</head>

<body>

  <h1>My Flash Game</h1>

  <div id="game-container"></div>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener("load", (event) => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      const container = document.getElementById("game-container");
      container.appendChild(player);

      // CONFIGURATION: Replace 'yourgame.swf' with your actual filename
      player.load("zuma_deluxe.swf");

      // Optional: Make the player fill the container
      player.style.width = "100%";
      player.style.height = "100%";
    });
  </script>

</body>

</html>
